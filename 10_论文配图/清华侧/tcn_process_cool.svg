="470.0" x2="1640" y2="470.0" stroke="#5A6B82" stroke-width="2.0" marker-end="url(#arrGray)"/><path d="M 770 390 Q 830.0 361 890 390" fill="none" stroke="#34D399" stroke-width="2.0" marker-end="url(#arrGreen)"/><path d="M 940 390 Q 1000.0 361 1060 390" fill="none" stroke="#34D399" stroke-width="2.0" marker-end="url(#arrGreen)"/><path d="M 1110 390 Q 1170.0 361 1230 390" fill="none" stroke="#34D399" stroke-width="2.0" marker-end="url(#arrGreen)"/><path d="M 1280 390 Q 1340.0 361 1400 390" fill="none" stroke="#34D399" stroke-width="2.0" marker-end="url(#arrGreen)"/><text x="1085.0" y="351" font-size="12.5" fill="#34D399" text-anchor="middle" font-weight="700">残差连接（逐元素相加）</text><text x="745.0" y="454.0" font-size="11.5" fill="#64748B" text-anchor="middle" font-weight="400">permute</text><text x="1625.0" y="496.0" font-size="11.5" fill="#64748B" text-anchor="middle" font-weight="400">reshape → (B,8,2)</text><line x1="1710.0" y1="545" x2="1710.0" y2="600" stroke="#FB7185" stroke-width="2.0" marker-end="url(#arrRose)"/><line x1="1710.0" y1="680" x2="1710.0" y2="720" stroke="#FB7185" stroke-width="2.0" marker-end="url(#arrRose)"/><text x="1726.0" y="572.5" font-size="11.5" fill="#64748B" text-anchor="start" font-weight="400">对比真实未来</text><line x1="380" y1="720" x2="1010.0" y2="905" stroke="#38BDF8" stroke-width="2.4" marker-end="url(#arrBlue)"/><line x1="1710.0" y1="800" x2="1010.0" y2="905" stroke="#FB7185" stroke-width="2.4" marker-end="url(#arrRose)"/><line x1="1120" y1="950.0" x2="1160" y2="950.0" stroke="#5A6B82" stroke-width="2.0" marker-end="url(#arrGray)"/><line x1="1330" y1="950.0" x2="1370" y2="950.0" stroke="#FB7185" stroke-width="2.0" marker-end="url(#arrRose)"/><text x="705.0" y="260" font-size="13" fill="#38BDF8" text-anchor="middle" font-weight="700">FluxEV 无监督分支</text><text x="820" y="300" font-size="13" fill="#FBBF24" text-anchor="middle" font-weight="700">TCN 神经网络分支（自监督）</text><text x="40" y="1054" font-size="12.5" fill="#64748B">① 训练：仅正常轨迹，最小化 MSE(ŷ, y_t